<!DOCTYPE html>
<html>
    <head>
        <title>Cat New Tab</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <img class="bgimage" src="catbg.jpg" alt="A cute cat">
        <div class="topbar">
            <p class="clock" id="time"></p>
        </div>
        <div class="panelcontainer">
        <div class="panel">
            <h1>Cat New Tab</h1>
            <p>Find what you need, and see cats while doing so!</p>
           
        </div>
        <div class="panel">
            <h1>Search on DuckDuckGo</h1>
            <input type="text" id="searchinput" placeholder="Search...">
            <button class="btn" id = "searchbtn">Search</button>
        </div>
        <div class="panel">
            <p>Press to get a random cat fact!</p>
            <button class="btn" id="randomcatfactbtn"]>Random Cat Fact</button>
            <p id="catfacttext" ></p>
        </div>
    </div>
    </body>
    <script src="script.js"></script>
</html>
